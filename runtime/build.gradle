import java.time.Duration

plugins {
    id 'java-library'
}

sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    smokeImplementation.extendsFrom implementation
    smokeRuntimeOnly.extendsFrom runtimeOnly
    nativeObserver {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    implementation project(':protocol')
    nativeObserver project(path: ':native', configuration: 'observerLibrary')
}

[rootProject.targetJavaVersion, rootProject.engineJavaVersion].each { javaVersion ->
    def smokeTest = tasks.register("nativeSmoke${javaVersion}", JavaExec) {
        group = 'verification'
        description = "Checks JNI and JVMTI loading on Java ${javaVersion}."
        dependsOn tasks.named('smokeClasses'), configurations.nativeObserver
        classpath = sourceSets.smoke.runtimeClasspath
        mainClass = 'io.connglli.gorrect.runtime.NativeSmoke'
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        timeout = Duration.ofSeconds(60)
        doFirst {
            def library = configurations.nativeObserver.singleFile.absolutePath
            setJvmArgs(["-agentpath:${library}"])
            setArgs([library])
        }
    }

    tasks.named('check') {
        dependsOn smokeTest
    }

    [false, true].each { withLocals ->
        def prefix = withLocals ? 'observerLocalsSmoke' : 'observerSmoke'
        def artifacts = withLocals ? 'observer-locals' : 'observer'
        def observerTest = tasks.register("${prefix}${javaVersion}", JavaExec) {
            group = 'verification'
            description = "Checks capture and retention on Java ${javaVersion}, local metadata=${withLocals}."
            dependsOn tasks.named('smokeClasses'), configurations.nativeObserver
            classpath = sourceSets.smoke.runtimeClasspath
            mainClass = 'io.connglli.gorrect.runtime.observe.ObserverFixture'
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(javaVersion)
            }
            timeout = Duration.ofSeconds(90)
            doFirst {
                def library = configurations.nativeObserver.singleFile.absolutePath
                def options = withLocals ? '=locals' : ''
                setJvmArgs(["-agentpath:${library}${options}", '-Xmx128m', '-Xbatch'])
                setArgs([library, layout.buildDirectory.dir("${artifacts}/java${javaVersion}").get().asFile.absolutePath])
            }
        }
        tasks.named('check') { dependsOn observerTest }
    }

}

[rootProject.targetJavaVersion, rootProject.engineJavaVersion].each { javaVersion ->
    def workerCheck = tasks.register("workerCaptureCheck${javaVersion}", JavaExec) {
        group = 'verification'
        description = "Checks coordinated worker rendezvous and primitive evidence on Java ${javaVersion}."
        dependsOn tasks.named('smokeClasses')
        classpath = sourceSets.smoke.runtimeClasspath
        mainClass = 'io.connglli.gorrect.runtime.WorkerCaptureCheck'
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        timeout = Duration.ofSeconds(30)
    }
    tasks.named('check') { dependsOn workerCheck }
}

[rootProject.targetJavaVersion, rootProject.engineJavaVersion].each { javaVersion ->
    ['success', 'wrong-mirror', 'duplicate', 'abort', 'truncated'].each { mode ->
        def taskName = "retainedObserver${mode.split('-').collect { it.capitalize() }.join('')}${javaVersion}"
        def retainedTest = tasks.register(taskName, JavaExec) {
            group = 'verification'
            description = "Checks retained code/frame certification (${mode}) on Java ${javaVersion}."
            dependsOn tasks.named('smokeClasses'), configurations.nativeObserver
            classpath = sourceSets.smoke.runtimeClasspath
            mainClass = 'Case'
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(javaVersion)
            }
            timeout = Duration.ofSeconds(60)
            doFirst {
                def library = configurations.nativeObserver.singleFile.absolutePath
                setJvmArgs(["-agentpath:${library}=retained-class", '-Xint', '-Xmx128m'])
                setArgs([library, layout.buildDirectory.dir("retained/java${javaVersion}/${mode}").get().asFile.absolutePath, mode])
            }
        }
        tasks.named('check') { dependsOn retainedTest }
    }
}

[rootProject.targetJavaVersion, rootProject.engineJavaVersion].each { javaVersion ->
    ['intended', 'legacy', 'mismatch'].each { overload ->
        def sessionTest = tasks.register("retainedSession${overload.capitalize()}${javaVersion}", JavaExec) {
            group = 'verification'
            description = "Checks retained startup failure delivery (${overload}) on Java ${javaVersion}."
            dependsOn tasks.named('smokeClasses'), configurations.nativeObserver
            classpath = sourceSets.smoke.runtimeClasspath
            mainClass = 'io.connglli.gorrect.runtime.RetainedSessionCheck'
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(javaVersion)
            }
            timeout = Duration.ofSeconds(30)
            doFirst {
                def library = configurations.nativeObserver.singleFile.absolutePath
                def mode = overload == 'mismatch' ? '' : '=retained-class'
                setJvmArgs(["-agentpath:${library}${mode}"])
                setArgs([library, layout.buildDirectory.dir("session/java${javaVersion}/${overload}").get().asFile.absolutePath, overload])
            }
        }
        tasks.named('check') { dependsOn sessionTest }
    }
}

