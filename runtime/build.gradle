[rootProject.targetJavaVersion, rootProject.engineJavaVersion].each { javaVersion ->
    def parkingTest = tasks.register("retainedParkingCheck${javaVersion}", JavaExec) {
        group = 'verification'
        description = "Checks interrupted retained parking and failure publication on Java ${javaVersion}."
        dependsOn tasks.named('smokeClasses')
        classpath = sourceSets.smoke.runtimeClasspath
        mainClass = 'io.connglli.gorrect.runtime.RetainedParkingCheck'
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        timeout = Duration.ofSeconds(30)
