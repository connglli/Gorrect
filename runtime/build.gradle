import java.time.Duration

plugins {
    id 'java-library'
}

sourceSets {
    smoke {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    smokeImplementation.extendsFrom implementation
    smokeRuntimeOnly.extendsFrom runtimeOnly
    nativeObserver {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    implementation project(':protocol')
    nativeObserver project(path: ':native', configuration: 'observerLibrary')
}

[rootProject.targetJavaVersion, rootProject.engineJavaVersion].each { javaVersion ->
    def smokeTest = tasks.register("nativeSmoke${javaVersion}", JavaExec) {
        group = 'verification'
        description = "Checks JNI and JVMTI loading on Java ${javaVersion}."
        dependsOn tasks.named('smokeClasses'), configurations.nativeObserver
        classpath = sourceSets.smoke.runtimeClasspath
        mainClass = 'io.connglli.gorrect.runtime.NativeSmoke'
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        timeout = Duration.ofSeconds(60)
        doFirst {
            def library = configurations.nativeObserver.singleFile.absolutePath
            setJvmArgs(["-agentpath:${library}"])
            setArgs([library])
        }
    }

    tasks.named('check') {
        dependsOn smokeTest
    }

    [false, true].each { withLocals ->
        def prefix = withLocals ? 'observerLocalsSmoke' : 'observerSmoke'
        def artifacts = withLocals ? 'observer-locals' : 'observer'
        def observerTest = tasks.register("${prefix}${javaVersion}", JavaExec) {
            group = 'verification'
            description = "Checks capture and retention on Java ${javaVersion}, local metadata=${withLocals}."
            dependsOn tasks.named('smokeClasses'), configurations.nativeObserver
            classpath = sourceSets.smoke.runtimeClasspath
            mainClass = 'io.connglli.gorrect.runtime.observe.ObserverFixture'
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(javaVersion)
            }
            timeout = Duration.ofSeconds(90)
            doFirst {
                def library = configurations.nativeObserver.singleFile.absolutePath
                def options = withLocals ? '=locals' : ''
                setJvmArgs(["-agentpath:${library}${options}", '-Xmx128m', '-Xbatch'])
                setArgs([library, layout.buildDirectory.dir("${artifacts}/java${javaVersion}").get().asFile.absolutePath])
            }
        }
        tasks.named('check') { dependsOn observerTest }
    }

}
