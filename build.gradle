plugins {
  id 'java'
  id 'com.gradleup.shadow' version '8.3.5'
}

group = 'io.connglli.gorrect'
version = '0.1-SNAPSHOT'

repositories {
  mavenCentral()
}


compileJava {
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

jar {
  manifest {
    attributes 'Main-Class': 'io.connglli.gorrect.Gorrect'
  }
}

// Archive all essential Gorrect files into a ZIP for distribution
tasks.register('archive', Zip) {
  dependsOn tasks.shadowJar

  description = "Archive the Gorrect project as a ZIP file"
  archiveFileName = "gorrect-${project.version}.zip"

  exclude '**/.idea'

  from("$project.rootDir") {
    include 'LICENSE'
    include 'README.md'
  }

  from("$buildDir/libs") {
    include shadowJar.archiveFileName.get()
    rename shadowJar.archiveFileName.get(), "gorrect.jar"
  }
}

dependencies {
  implementation fileTree(dir: 'lib', includes: ['*.jar'])

  compileOnly("org.projectlombok:lombok:1.18.38")
  annotationProcessor("org.projectlombok:lombok:1.18.38")

  testImplementation platform('org.junit:junit-bom:5.10.0')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testCompileOnly("org.projectlombok:lombok:1.18.38")
  testAnnotationProcessor("org.projectlombok:lombok:1.18.38")
}

test {
  useJUnitPlatform()
}
