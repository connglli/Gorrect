plugins {
    id 'base'
}

ext {
    engineJavaVersion = 21
    targetJavaVersion = 17
}

allprojects {
    group = 'io.connglli.gorrect'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    plugins.withId('java') {
        java {
            toolchain.languageVersion = JavaLanguageVersion.of(rootProject.engineJavaVersion)
        }

        tasks.withType(JavaCompile).configureEach {
            options.release = project.name == 'engine' ? rootProject.engineJavaVersion : rootProject.targetJavaVersion
            options.encoding = 'UTF-8'
            options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
        }

        tasks.withType(Javadoc).configureEach {
            options.encoding = 'UTF-8'
            options.addBooleanOption('Xdoclint:all,-missing', true)
            options.addBooleanOption('Werror', true)
            options.addBooleanOption('private', true)
        }
        tasks.named('check') { dependsOn tasks.named('javadoc') }
    }
}

['assemble', 'check', 'clean'].each { taskName ->
    tasks.named(taskName) {
        dependsOn subprojects.collect { "${it.path}:${taskName}" }
    }
}
