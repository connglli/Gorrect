default_install_hook_types:
  - pre-commit  # Make sure hooks at the pre-commit stage are enabled
  - commit-msg  # Make sure hooks at the commit-msg stage are enabled

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.17.3
    hooks:
      # Run the linter.
      - id: ruff-check
        fail_fast: true
      # Run the formatter.
      - id: ruff-format
        types_or: [python, pyi, jupyter]
  # Restrict clang-format to native C/C++; its upstream hook also accepts Java.
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.8
    hooks:
      - id: clang-format
        files: ^native/
        types_or: [c, c++]
        stages: [pre-commit]
  # The formatter runs on JDK 21+ and also formats Java 17 source.
  - repo: https://github.com/extenda/pre-commit-hooks
    rev: v0.17.0
    hooks:
      - id: google-java-formatter
        files: ^(engine|runtime|protocol)/.*\.java$
        # Keep formatting stable without unused-import cleanup.
        args: [--, --skip-removing-unused-imports]
        # Avoid concurrent first-use downloads to the hook's shared JAR.
        require_serial: true
        stages: [pre-commit]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [ commit-msg ]
        args: [ "--verbose", "--strict" ]
