plugins {
    id 'application'
}

application {
    mainClass = 'io.connglli.gorrect.engine.cli.Main'
    applicationName = 'gorrect'
}

dependencies {
    implementation project(':protocol')
    implementation 'com.google.code.gson:gson:2.14.0'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
    nativeObserver { canBeConsumed = false; canBeResolved = true }
}

dependencies { nativeObserver project(path: ':native', configuration: 'observerLibrary') }

distributions {
    main {
        contents {
            into('support') {
                from({ project(':runtime').tasks.named('jar').get() }) { rename { 'runtime.jar' } }
                from({ project(':protocol').tasks.named('jar').get() }) { rename { 'protocol.jar' } }
                from(configurations.nativeObserver)
            }
        }
    }
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/ObserverArtifactsTest.class'
    exclude '**/RunEngineTest.class'
    exclude '**/JitEvidenceTest.class'
}

def observerIntegration = tasks.register('observerIntegration', Test) {
    group = 'verification'
    description = 'Verifies raw native captures independently on the engine JVM.'
    dependsOn ':runtime:observerSmoke17', ':runtime:observerSmoke21'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/ObserverArtifactsTest.class'
    [17, 21].each {
        inputs.dir(project(':runtime').layout.buildDirectory.dir("observer/java${it}"))
                .withPathSensitivity(PathSensitivity.RELATIVE)
    }
    systemProperty 'gorrect.observer.artifacts', [17, 21].collect {
        project(':runtime').layout.buildDirectory.dir("observer/java${it}").get().asFile.absolutePath
    }.join(File.pathSeparator)
}

tasks.named('check') { dependsOn observerIntegration }

def sequentialIntegration = tasks.register('sequentialIntegration', Test) {
    group = 'verification'
    description = 'Runs generated cases, offline verification, replay, and process failure checks.'
    dependsOn tasks.named('installDist')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/RunEngineTest.class'
    include '**/JitEvidenceTest.class'
    inputs.dir(layout.buildDirectory.dir('install/gorrect/support'))
            .withPathSensitivity(PathSensitivity.RELATIVE)
    [17, 21].each { feature ->
        def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(feature) }
        doFirst { systemProperty "gorrect.java${feature}", launcher.get().executablePath.asFile.absolutePath }
    }
    systemProperty 'gorrect.support', layout.buildDirectory.dir('install/gorrect/support').get().asFile.absolutePath
}
tasks.named('check') { dependsOn sequentialIntegration }

tasks.named('processTestResources') {
    from(rootProject.file('docs/gir.md')) {
        into 'docs'
    }
    from(rootProject.file('protocol/src/test/resources/snapshot-v1.hex')) {
        into 'wire'
    }
}
