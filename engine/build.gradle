plugins {
    id 'java-library'
}

dependencies {
    implementation project(':protocol')
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyLocking {
    lockAllConfigurations()
}

tasks.named('test') {
    useJUnitPlatform()
    exclude '**/ObserverArtifactsTest.class'
}

def observerIntegration = tasks.register('observerIntegration', Test) {
    group = 'verification'
    description = 'Verifies raw native captures independently on the engine JVM.'
    dependsOn ':runtime:observerSmoke17', ':runtime:observerSmoke21'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    include '**/ObserverArtifactsTest.class'
    [17, 21].each {
        inputs.dir(project(':runtime').layout.buildDirectory.dir("observer/java${it}"))
                .withPathSensitivity(PathSensitivity.RELATIVE)
    }
    systemProperty 'gorrect.observer.artifacts', [17, 21].collect {
        project(':runtime').layout.buildDirectory.dir("observer/java${it}").get().asFile.absolutePath
    }.join(File.pathSeparator)
}

tasks.named('check') { dependsOn observerIntegration }

tasks.named('processTestResources') {
    from(rootProject.file('docs/gir.md')) {
        into 'docs'
    }
    from(rootProject.file('protocol/src/test/resources/snapshot-v1.hex')) {
        into 'wire'
    }
}
